<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background-image: url('Frame.png'), linear-gradient(rgba(68, 56, 56, 0.5), rgba(0, 0, 0, 0.0)), url('VSnoTextCover.PNG');
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-size: 100% 107.3%, 100% 122%, 100% 150%;
    background-position: 0% 86.5%, 0%, center;
    background-attachment: fixed, fixed, fixed;
    overflow-x: hidden;
    margin: 0;
  }

   .topnav { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding-left: 10%; 
    position: relative;
    max-height: 120px;
    z-index: 30; 
  }
  .logo img { width: 110%; height: auto; } 
  .menu-icon { display: none; cursor: pointer; font-size: 7vw; color: white; }

  div.links { 
    display: flex; 
    gap: 20px;
    margin-right: 50px;
    align-self: center;
  }
  div.links a { 
    color: white; 
    text-decoration: none; 
    font-size: 2rem; 
   
  }

  .welcome p {
    font-size: 5vw; 
    text-align: center; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    width: 100%; 
    position: relative; 
    gap: 20px; 
    flex-wrap: wrap;
    margin-left: 5%;
  }

@media (max-width: 768px) {
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    body { 
      background-image: url('Frame.png'), linear-gradient(rgba(101, 1, 1, 0.5), rgba(0, 0, 0, 0.5)), url('editBotaSpread.png'); 
      background-size: 0% 0%, cover, cover; 
      background-attachment: scroll, scroll, scroll;
    }
    
    .topnav { padding: 0 20px !important; }
    .menu-icon { margin-right: 10px !important; display: block; font-size: 8vw; color: white; }

    .spotlight p, 
    .spotlightTxt, 
    .announcements p, 
    .announcementsTxt { 
      margin-left: auto !important; 
      margin-right: auto !important; 
      text-align: center !important; 
    }
    
    div.links { 
      display: none; 
      flex-direction: column; 
      width: 60% !important; 
      height: 100vh !important; 
      background: rgba(0,0,0,0.95) !important; 
      position: fixed !important; 
      top: 60px !important;  
      right: 0 !important; 
      left: auto !important;
      z-index: 9999 !important;
      margin: 0 !important;
    }
    
    .links.responsive { display: flex; }
    
    .links a { 
      color: white; 
      text-decoration: none; 
      padding: 20px; 
      border-bottom: 1px solid #333; 
      font-size: x-large; 
      text-align: center;
    }


    .reviveLogo { position: relative !important; text-align: center; margin: 20px auto !important; margin-top: 500px !important; }
    .reviveLogo img { width: 40% !important; margin: 0 auto !important; } 
  }
</style>
</head>

  </div>
