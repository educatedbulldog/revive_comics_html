<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background-image: url('null.png'), linear-gradient(rgba(68, 56, 56, 0.5), rgba(0, 0, 0, 0.0)), url('socials.jpeg');
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-size: 100% 107.3%, 100% 122%, 120% 120%;
    background-position: 0% 86.5%, 0%, 60% 0%;
    background-attachment: fixed, fixed, fixed;
    overflow-x: hidden;
    margin: 0;
  }

   .topnav { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding-left: 10%; 
    position: relative;
    max-height: 120px;
    z-index: 30; 
  }
  .logo img { width: 110%; height: auto; } 
  .menu-icon { display: none; cursor: pointer; font-size: 7vw; color: white; }

  div.links { 
    display: flex; 
    gap: 20px;
    margin-right: 50px;
    align-self: center;
  }
  div.links a { 
    color: white; 
    text-decoration: none; 
    font-size: 2rem; 
   
  }

  .welcome p {
    font-size: 5vw; 
    text-align: center; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    width: 100%; 
    position: relative; 
    gap: 20px; 
    flex-wrap: wrap;
    margin-left: 5%;
  }

@media (max-width: 768px) {
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    body { 
      background-image: url('Frame.png'), linear-gradient(rgba(101, 1, 1, 0.5), rgba(0, 0, 0, 0.1)), url('mobileSocial.png'); 
      background-size: 0% 0%, 100% 100%, 140% 100%; 
      background-position: 0%,0%,0% 0%;
      background-attachment: scroll, scroll, scroll;
      background-color: black;
    }
    
    .topnav { padding: 0 20px !important; }
    .menu-icon { margin-right: 10px !important; display: block; font-size: 8vw; color: white; }

    .spotlight p, 
    .spotlightTxt, 
    .announcements p, 
    .announcementsTxt { 
      margin-left: auto !important; 
      margin-right: auto !important; 
      text-align: center !important; 
    }
    
    div.links { 
      display: none; 
      flex-direction: column; 
      width: 60% !important; 
      height: 100vh !important; 
      background: rgba(0,0,0,0.95) !important; 
      position: fixed !important; 
      top: 60px !important;  
      right: 0 !important; 
      left: auto !important;
      z-index: 9999 !important;
      margin: 0 !important;
    }
    
    .links.responsive { display: flex; }
    
    .links a { 
      color: white; 
      text-decoration: none; 
      padding: 20px; 
      border-bottom: 1px solid #333; 
      font-size: x-large; 
      text-align: center;
    }
    .sign{
      width: 130% !important;
      margin-left:-11% !important;

    }
    .socials{
      margin-left: 12% !important;
    }
    .socials img{
      width:40% !important;
      height:100% !important;
      padding-top: 12%;

    }
      .socials p{
      height:100% !important;
      width:60% !important;
      font-size: 7vw!important;
      margin-left: 40%!important;
      margin-top: -20%!important;
    }
    .reviveLogo { position: relative !important; text-align: center; margin: 20px auto !important; margin-top: 500px !important; }
    .reviveLogo img { width: 40% !important; margin: 0 auto !important; } 
  }
</style>
</head>
<body>

<div class="topnav" id="myTopnav">
  <div class="logo">
    <img src="LogoSm.png" style="width: 100%; max-width: 200px;height: auto; margin-left: -20%; margin-top: 20px;"> 
  </div>
  
  <div class="menu-icon" onclick="toggleMenu();">☰</div>

  <div class="links" id="navLinks">
    <a href="index.html">Home</a> 
    <a href="comics.html">Comics</a>
    <a class="active" href="socials.html">Socials</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </div>
</div>
<div class="sign">
  <img src="socialsSign.png" style="width: 50%; height: auto; margin-left: 24%; margin-right: auto;">

</div>
<div class="socials "style="margin-left:30%;">
<a href="https://www.instagram.com/revive_comics/" target="_blank" style="text-decoration: none;">
  <img src="INSTA.png" style="width: 15%; height: auto; ">
  <p style="font-size:4vw; margin-top: -11%; background-color: #333;width: 40%;">@revive_comics</p>
</a>
<a href="https://www.facebook.com/people/Revive-Comics/61577513204768/" target="_blank" style="text-decoration: none;">
<img src="FB.png" style="width: 15%; height: auto;">
<p style="font-size:4vw; margin-top: -11%; background-color: #333; width: 37%;">Revive Comics</p>
</a>

</div>


<div class="reviveLogo" style="position: fixed; bottom: -10px; right: -150px; z-index: 10;">
  <img src="ReviveLogo.png" style="width: 50%; display: block;">
</div>

</body>
<script>
  function toggleMenu() {
    var x = document.getElementById("navLinks");
    x.classList.toggle("responsive");
  }
</script>
</html>
